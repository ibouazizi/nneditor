[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nneditor"
description = "A scalable, capability-aware neural-network viewer and editor."
dynamic = ["version"]
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Imed Bouazizi", email = "ibouazizi@gmail.com" },
]
keywords = [
    "flet",
    "jax",
    "machine-learning",
    "model-editor",
    "neural-network",
    "onnx",
    "pruning",
    "pytorch",
    "quantization",
    "visualization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "flet[all]==0.86.4",
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    # Import remains on NNEditor's lazy wire reader.  The official bindings are
    # used only after import for Phase 4 schema validation, checking, shape
    # inference, and export.
    "onnx>=1.22,<2",
]

# ONNX Runtime ships one distribution per accelerator family, and every one of
# them owns the same `onnxruntime` import name — a hard dependency on the CPU
# wheel would conflict with all of them and make GPU/NPU tracing unreachable.
# Tracing therefore degrades to the ONNX reference evaluator when no runtime
# is importable, and each extra names one installable runtime flavour.
[project.optional-dependencies]
runtime = ["onnxruntime>=1.22,<2"]
runtime-gpu = ["onnxruntime-gpu>=1.22,<2"]
runtime-directml = ["onnxruntime-directml>=1.22,<2"]
runtime-qnn = ["onnxruntime-qnn>=1.22,<2"]
runtime-openvino = ["onnxruntime-openvino>=1.22,<2"]

[project.scripts]
nneditor = "nneditor.ui.app:cli"

[project.urls]
Repository = "https://github.com/ibouazizi/nneditor"

[tool.flet]
product = "NNEditor"
artifact = "nneditor"

[tool.hatch.version]
path = "src/nneditor/__init__.py"

[dependency-groups]
dev = [
    "jax>=0.4.35",
    "mypy>=1.18,<2",
    # The CPU runtime, so the ONNX Runtime tracing paths stay tested even
    # though the published package no longer requires a runtime.
    "onnxruntime>=1.22,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "safetensors>=0.4",
    "torch>=2.6,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nneditor"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/nneditor",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-m",
    "not performance",
]
markers = [
    "performance: wall-clock and scale regression tests run separately from coverage",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C901", "E", "F", "I", "PLR0912", "PLR0915", "RUF", "UP"]

# Structural ceilings, not style preferences. Without them a single function
# or constructor can grow without bound: the shell's `__init__` reached 649
# lines before these rules existed. The limits are deliberately generous, so
# tripping one means a function genuinely needs splitting.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-branches = 25
max-statements = 80

# A shrinking baseline of functions that predate the ceilings above. Each entry
# is debt with a known owner, not an exemption: delete the entry once the
# function is split. Do not add new entries — write a smaller function instead.
[tool.ruff.lint.per-file-ignores]
# Wire-format and pickle-opcode dispatch loops. These are long by nature
# (one branch per protobuf field kind / pickle opcode) and splitting them
# needs a dispatch-table refactor rather than a mechanical extraction.
"src/nneditor/adapters/onnx/indexer.py" = ["C901", "PLR0912", "PLR0915"]
"src/nneditor/adapters/pytorch/pickle_scan.py" = ["C901", "PLR0912", "PLR0915"]
"src/nneditor/adapters/pytorch/pt2.py" = ["C901", "PLR0912", "PLR0915"]
# Export staging/publication and the streaming statistics pass.
"src/nneditor/adapters/onnx/exporter.py" = ["C901", "PLR0915"]
"src/nneditor/analysis/statistics.py" = ["C901"]
# `Shell.__init__` only: 649 -> 564 lines after the panel extractions, still
# above the statement ceiling. Remaining work is moving control construction
# into `shell_layout` factories.
"src/nneditor/ui/app.py" = ["PLR0915"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
